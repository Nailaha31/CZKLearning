<style>
/* Concept : l'établi du démonteur. PC : rail d'outils à gauche + colonne de lecture. Téléphone : cartes plein écran qu'on fait défiler.
   Motif : la flèche du débogueur (le pointeur d'instruction) marque « là où tu en es » ; les phases sont numérotées en hexadécimal. */
:root {
  --ink: #0f1218;
  --panel: #161a22;
  --panel-2: #1e2331;
  --code-bg: #0b0e14;
  --rule: #2a3140;
  --text: #e8e5de;
  --muted: #9aa2b2;
  --faint: #6f788b;
  --amber: #f2b33d;
  --accent-fill: #f2b33d;
  --on-accent: #241800;
  --amber-soft: rgba(242, 179, 61, .14);
  --amber-line: rgba(242, 179, 61, .45);
  --cyan: #67d3ea;
  --cyan-soft: rgba(103, 211, 234, .13);
  --cyan-line: rgba(103, 211, 234, .40);
  --rose: #ff8f7a;
  --rose-soft: rgba(255, 143, 122, .13);
  --rose-line: rgba(255, 143, 122, .42);
  --green: #7fd69a;
  --green-soft: rgba(127, 214, 154, .13);
  --green-line: rgba(127, 214, 154, .42);
  --wash-cyan: #0f1a21;
  --wash-green: #0f1a15;
  --wash-rose: #1d1315;
  --wash-amber: #1c170d;
  --scrim: rgba(4, 6, 9, .62);
  --qr-bg: #ffffff;
  --t-kw: #ffb86b; --t-str: #a9e5a3; --t-num: #f2b33d; --t-com: #7f889a; --t-reg: #67d3ea;
  --t-mn: #f6f1e6; --t-dir: #c4a5ff; --t-pre: #ff9ec4; --t-lbl: #8fc7ff;
  --font-display: "Chakra Petch", "Bahnschrift", "Segoe UI", sans-serif;
  --font-body: "Atkinson Hyperlegible Next", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Atkinson Hyperlegible Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ink: #f1f3f6; --panel: #ffffff; --panel-2: #e8ebf1; --code-bg: #f7f8fb; --rule: #d3d8e2;
    --text: #161a22; --muted: #566074; --faint: #747c8e;
    --amber: #8f5a00; --accent-fill: #e9a73a; --on-accent: #231600;
    --amber-soft: rgba(212, 140, 20, .14); --amber-line: rgba(160, 100, 0, .45);
    --cyan: #0b6f84; --cyan-soft: rgba(11, 111, 132, .10); --cyan-line: rgba(11, 111, 132, .35);
    --rose: #b8432f; --rose-soft: rgba(184, 67, 47, .09); --rose-line: rgba(184, 67, 47, .35);
    --green: #1e7f45; --green-soft: rgba(30, 127, 69, .10); --green-line: rgba(30, 127, 69, .35);
    --wash-cyan: #e8f3f6; --wash-green: #eaf5ee; --wash-rose: #f8ecea; --wash-amber: #f8f0df;
    --scrim: rgba(20, 24, 32, .45); --qr-bg: #ffffff;
    --t-kw: #a04d00; --t-str: #2f7d32; --t-num: #8f5a00; --t-com: #737b8c; --t-reg: #0b6f84;
    --t-mn: #161a22; --t-dir: #6b44b8; --t-pre: #b3306e; --t-lbl: #1f5fa8;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --ink: #f1f3f6; --panel: #ffffff; --panel-2: #e8ebf1; --code-bg: #f7f8fb; --rule: #d3d8e2;
  --text: #161a22; --muted: #566074; --faint: #747c8e;
  --amber: #8f5a00; --accent-fill: #e9a73a; --on-accent: #231600;
  --amber-soft: rgba(212, 140, 20, .14); --amber-line: rgba(160, 100, 0, .45);
  --cyan: #0b6f84; --cyan-soft: rgba(11, 111, 132, .10); --cyan-line: rgba(11, 111, 132, .35);
  --rose: #b8432f; --rose-soft: rgba(184, 67, 47, .09); --rose-line: rgba(184, 67, 47, .35);
  --green: #1e7f45; --green-soft: rgba(30, 127, 69, .10); --green-line: rgba(30, 127, 69, .35);
  --wash-cyan: #e8f3f6; --wash-green: #eaf5ee; --wash-rose: #f8ecea; --wash-amber: #f8f0df;
  --scrim: rgba(20, 24, 32, .45); --qr-bg: #ffffff;
  --t-kw: #a04d00; --t-str: #2f7d32; --t-num: #8f5a00; --t-com: #737b8c; --t-reg: #0b6f84;
  --t-mn: #161a22; --t-dir: #6b44b8; --t-pre: #b3306e; --t-lbl: #1f5fa8;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --ink: #0f1218; --panel: #161a22; --panel-2: #1e2331; --code-bg: #0b0e14; --rule: #2a3140;
  --text: #e8e5de; --muted: #9aa2b2; --faint: #6f788b;
  --amber: #f2b33d; --accent-fill: #f2b33d; --on-accent: #241800;
  --amber-soft: rgba(242, 179, 61, .14); --amber-line: rgba(242, 179, 61, .45);
  --cyan: #67d3ea; --cyan-soft: rgba(103, 211, 234, .13); --cyan-line: rgba(103, 211, 234, .40);
  --rose: #ff8f7a; --rose-soft: rgba(255, 143, 122, .13); --rose-line: rgba(255, 143, 122, .42);
  --green: #7fd69a; --green-soft: rgba(127, 214, 154, .13); --green-line: rgba(127, 214, 154, .42);
  --wash-cyan: #0f1a21; --wash-green: #0f1a15; --wash-rose: #1d1315; --wash-amber: #1c170d;
  --scrim: rgba(4, 6, 9, .62); --qr-bg: #ffffff;
  --t-kw: #ffb86b; --t-str: #a9e5a3; --t-num: #f2b33d; --t-com: #7f889a; --t-reg: #67d3ea;
  --t-mn: #f6f1e6; --t-dir: #c4a5ff; --t-pre: #ff9ec4; --t-lbl: #8fc7ff;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--text);
  font: 400 1.0625rem/1.6 var(--font-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--amber); text-underline-offset: 3px; }
code { font-family: var(--font-mono); font-size: .92em; }
p code, li code, dd code, .fc-texte code, .sub code {
  padding: .05em .35em; border-radius: 5px; background: var(--panel-2); color: var(--text);
}
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.eyebrow {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  font: 600 .78rem/1.3 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
}
.eyebrow .ip { color: var(--amber); display: inline-grid; }
.lbl { font: 700 .74rem/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; }

/* ---------- Boutons et puces ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  min-height: 44px; padding: .6em 1.1em; border-radius: 9px;
  border: 1px solid var(--rule); background: var(--panel); color: var(--text);
  font: 600 .98rem/1.2 var(--font-body); text-decoration: none; cursor: pointer;
  transition: border-color .15s ease, filter .15s ease, transform .1s ease;
}
.btn:hover { border-color: var(--amber-line); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; }
.btn.big { min-height: 52px; padding: .8em 1.4em; font-size: 1.05rem; }
.btn.wide { width: 100%; }
.btn.danger { border-color: var(--rose-line); color: var(--rose); background: transparent; }
.lnk {
  background: none; border: 0; padding: 6px 2px; color: var(--muted); cursor: pointer;
  font: 600 .92rem/1.2 var(--font-body); text-decoration: underline; text-underline-offset: 3px; justify-self: center;
}
.lnk:hover { color: var(--text); }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: .25em .65em; border-radius: 999px;
  border: 1px solid var(--rule); color: var(--muted);
  font: 600 .7rem/1.2 var(--font-display); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;
}
.chip.cur { color: var(--amber); border-color: var(--amber-line); }
.chip.ok { color: var(--green); border-color: var(--green-line); }

/* ---------- Démarrage ---------- */
.boot { min-height: 70vh; display: grid; place-items: center; padding: 24px; text-align: center; }
.boot .wm { font: 700 2rem/1 var(--font-display); }
.boot p { color: var(--muted); margin-top: 10px; }

/* ---------- Coque PC ---------- */
.shell {
  display: grid; grid-template-columns: 228px minmax(0, 1fr); gap: 52px;
  max-width: 1220px; margin: 0 auto;
  padding-block: 30px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 26px); align-self: start; display: grid; gap: 26px; }
.wordmark { display: grid; gap: 7px; color: var(--text); text-decoration: none; }
.wm { font: 700 1.55rem/1 var(--font-display); letter-spacing: .01em; }
.wm-sub { font: 400 .82rem/1.25 var(--font-mono); color: var(--amber); }
.nav { display: grid; gap: 2px; }
.nav a {
  display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 8px; align-items: center;
  padding: 8px 10px 8px 6px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 600;
}
.nav a .ipm { color: var(--amber); display: grid; place-items: center; visibility: hidden; }
.nav a:hover { color: var(--text); }
.nav a[aria-current="page"] { color: var(--text); background: var(--panel); }
.nav a[aria-current="page"] .ipm { visibility: visible; }
.sync { font-size: .82rem; color: var(--faint); line-height: 1.45; }
.phone-card { display: grid; gap: 10px; padding: 16px; border: 1px solid var(--rule); border-radius: 12px; }
.phone-card p { font-size: .9rem; color: var(--muted); line-height: 1.5; }
.qr { background: var(--qr-bg); padding: 8px; border-radius: 8px; width: 136px; }
.qr.big { width: 220px; }
.qr svg, .qr img { display: block; width: 100%; height: auto; }
@media (max-width: 920px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 28px; padding-block: 20px 64px; }
  .rail { position: static; gap: 14px; }
  .nav { display: flex; flex-wrap: wrap; gap: 4px; }
  .nav a { grid-template-columns: auto; padding: 6px 10px; }
  .nav a .ipm { display: none; }
  .phone-card, .sync { display: none; }
}

/* ---------- Pages ---------- */
.page { display: grid; gap: 44px; min-width: 0; }
.page.narrow { max-width: 760px; }
.vh { display: grid; gap: 12px; }
.vh h1, .reprendre h1, .lecon-head h1 { font-size: clamp(1.8rem, 1.15rem + 2.1vw, 2.65rem); line-height: 1.08; }
.sub { color: var(--muted); max-width: 64ch; }

.reprendre {
  display: grid; gap: 14px; padding: 28px 30px;
  border: 1px solid var(--rule); border-radius: 16px; background: var(--panel);
}
.reprendre .meta { color: var(--muted); }
.reprendre .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; margin-top: 4px; }
.inline-stats { color: var(--muted); font-size: .95rem; font-variant-numeric: tabular-nums; }
.sec { display: grid; gap: 18px; }
.sec-head { display: grid; gap: 8px; }
.sec-head h2 { font-size: 1.5rem; }

/* La carte du parcours : une table d'adresses mémoire */
.map { list-style: none; margin: 0; padding: 0; }
.ph { display: grid; grid-template-columns: 3.2rem 18px minmax(0, 1fr); column-gap: 14px; position: relative; padding-block: 13px; }
.ph::before { content: ""; position: absolute; left: calc(3.2rem + 14px + 8px); top: 0; bottom: 0; width: 2px; background: var(--rule); }
.ph:first-child::before { top: 24px; }
.ph:last-child::before { bottom: auto; height: 24px; }
.ph-addr { font: 400 .86rem/1.5 var(--font-mono); color: var(--faint); text-align: right; padding-top: 3px; }
.ph-node { width: 18px; height: 18px; margin-top: 5px; border-radius: 50%; border: 2px solid var(--faint); background: var(--ink); position: relative; z-index: 1; }
.ph.is-encours .ph-node { border-color: var(--amber); background: var(--amber); box-shadow: 0 0 0 5px var(--amber-soft); }
.ph.is-faite .ph-node { border-color: var(--green); background: var(--green); }
.ph.is-encours .ph-addr { color: var(--amber); }
.ph-body { display: grid; gap: 6px; min-width: 0; }
.ph-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ph-top h3 { font-size: 1.2rem; }
.ph-duree { margin-left: auto; font: 400 .84rem/1.2 var(--font-mono); color: var(--faint); }
.ph-sauras { max-width: 62ch; }
.ph-boss { color: var(--muted); font-size: .97rem; max-width: 62ch; }
.ph-boss .lbl { color: var(--rose); margin-right: 6px; }
.ph.is-verrou h3, .ph.is-verrou .ph-sauras { color: var(--muted); }
.ph.is-verrou .ph-boss { color: var(--faint); }
.ph-lecons { list-style: none; margin: 10px 0 2px; padding: 0; display: grid; gap: 7px; }
.lec {
  display: grid; grid-template-columns: 2.8rem minmax(0, 1fr) auto auto; gap: 12px; align-items: center;
  padding: 11px 14px; border: 1px solid var(--rule); border-radius: 10px;
  background: var(--panel); color: var(--text); text-decoration: none;
}
a.lec:hover { border-color: var(--amber-line); }
.lec.is-next { border-color: var(--amber-line); background: var(--amber-soft); }
.lec.is-off { background: transparent; border-style: dashed; color: var(--muted); }
.lnum { font: 600 .9rem/1 var(--font-mono); color: var(--amber); }
.lec.is-off .lnum { color: var(--faint); }
.ld { font: 400 .82rem/1 var(--font-mono); color: var(--faint); white-space: nowrap; }
.lst { display: inline-flex; align-items: center; gap: 4px; font: 600 .7rem/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
.lst.cur { color: var(--amber); }
.lst.ok { color: var(--green); }
.fils { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 14px; }
.fil { display: grid; gap: 7px; align-content: start; padding: 18px 20px; border: 1px solid var(--rule); border-radius: 12px; }
.fil h3 { font-size: 1.05rem; }
.fil p { color: var(--muted); font-size: .96rem; }
.fil .lnk { justify-self: start; }

/* ---------- Leçon ---------- */
.lecon { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; max-width: 74ch; min-width: 0; }
.page { grid-template-columns: minmax(0, 1fr); }
.lecon > *, .page > *, .b-code > *, .b-capot > *, .pane > *, .b-atoi > *, .b-texte > *,
.fc-main > *, .fc-capot > *, .fc-rep > *, .octets > *, .code-wrap > *, .sol-body > * { min-width: 0; }
.b-capot { container-type: inline-size; }
@container (max-width: 760px) {
  .b-capot .capot-panes { grid-template-columns: minmax(0, 1fr); }
  .b-capot .pane-arrow .h { display: none; }
  .b-capot .pane-arrow .v { display: inline; }
}
.back { justify-self: start; color: var(--muted); font-weight: 600; text-decoration: none; }
.back:hover { color: var(--text); }
.tel-note { padding: 12px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--rule); color: var(--muted); font-size: .95rem; }
.lecon-head { display: grid; gap: 14px; padding-bottom: 24px; border-bottom: 1px solid var(--rule); }
.lecon-head .addr { font-family: var(--font-mono); color: var(--amber); letter-spacing: 0; }
.lecon-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); }
.lecon-meta .dur { font-family: var(--font-mono); color: var(--text); }
.b-accroche { font-size: 1.33rem; line-height: 1.5; text-wrap: pretty; }
.b-texte { display: grid; gap: 12px; }
.b-texte h2, .b-anglais h2, .b-jeux h2, .b-atoi h2, .b-quiz h2, .b-resume h2 { font-size: 1.45rem; }
.b-texte p { text-wrap: pretty; }

.b-schema { margin: 0; display: grid; gap: 12px; }
.flow { display: grid; grid-template-columns: minmax(0, 1fr) 26px minmax(0, 1fr) 26px minmax(0, 1fr) 26px minmax(0, 1fr); align-items: stretch; }
.fnode { display: grid; gap: 6px; align-content: start; padding: 14px; border: 1px solid var(--rule); border-radius: 12px; background: var(--panel); min-width: 0; }
.fnode.tool { border-color: var(--amber-line); background: var(--wash-amber); }
.fnode.cpu { border-color: var(--cyan-line); background: var(--wash-cyan); }
.fk { font: 700 .72rem/1.2 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.fnode.tool .fk { color: var(--amber); }
.fnode.cpu .fk { color: var(--cyan); }
.fv { font: 700 1.05rem/1.2 var(--font-display); overflow-wrap: anywhere; }
code.fv { font-family: var(--font-mono); font-weight: 600; font-size: 1rem; }
.fd { font-size: .88rem; color: var(--muted); line-height: 1.4; }
.fd.bytes { font-family: var(--font-mono); color: var(--cyan); letter-spacing: .02em; }
.farrow { align-self: center; justify-self: center; width: 100%; height: 2px; background: var(--faint); position: relative; }
.farrow::after { content: ""; position: absolute; right: -2px; top: -5px; border: 6px solid transparent; border-left-color: var(--faint); }
.b-schema figcaption { color: var(--muted); font-size: .95rem; }
@media (max-width: 720px) {
  .flow { grid-template-columns: minmax(0, 1fr); }
  .farrow { width: 2px; height: 22px; }
  .farrow::after { right: auto; left: -5px; top: auto; bottom: -6px; border-left-color: transparent; border-top-color: var(--faint); }
}

.code {
  margin: 0; background: var(--code-bg); border: 1px solid var(--rule); border-radius: 10px;
  padding-block: 12px; overflow-x: auto; font: 400 .95rem/1.7 var(--font-mono); tab-size: 4;
}
.code code { display: grid; min-width: max-content; font: inherit; }
.cl { display: grid; grid-template-columns: 2.2ch minmax(0, 1fr); gap: 14px; padding-inline: 10px 18px; border-left: 3px solid transparent; transition: background-color .12s ease; }
.cn { color: var(--faint); text-align: right; user-select: none; }
.cc { white-space: pre; }
.cl.hi { background: var(--amber-soft); }
.cl.g { cursor: pointer; }
.cl.g0 { border-left-color: var(--amber-line); }
.cl.g1 { border-left-color: var(--cyan-line); }
.cl.g2 { border-left-color: var(--green-line); }
.cl.g3 { border-left-color: var(--rose-line); }
.cl.g0.on, .cl.on { background: var(--amber-soft); }

.t-com { color: var(--t-com); font-style: italic; } .t-reg { color: var(--t-reg); } .t-mn { color: var(--t-mn); font-weight: 600; }
.t-dir { color: var(--t-dir); } .t-pre { color: var(--t-pre); } .t-lbl { color: var(--t-lbl); }
.b-code { margin: 0; display: grid; gap: 10px; }
.b-code figcaption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; font-weight: 700; }
.lang { font: 600 .72rem/1.7 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.notes li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding: 8px 12px; border-radius: 8px; }
.notes li:hover { background: var(--panel); }
.nl { font: 600 .8rem/1.8 var(--font-mono); color: var(--amber); white-space: nowrap; }

.b-capot { display: grid; gap: 16px; padding: 24px; border: 1px solid var(--cyan-line); border-radius: 16px; background: var(--wash-cyan); min-width: 0; }
.capot-head { display: grid; gap: 6px; }

@media (max-width: 760px) {

}
.octets { display: grid; gap: 8px; }
.oct-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 10px; }
.oct { display: grid; gap: 6px; align-content: start; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 10px; background: var(--code-bg); min-width: 0; transition: border-color .12s ease; }

.byte { padding: 2px 6px; border-radius: 5px; background: var(--panel-2); }
.byte.op { background: var(--accent-fill); color: var(--on-accent); }
.byte.val { color: var(--cyan); }
.oct-asm { font: 400 .88rem/1.3 var(--font-mono); color: var(--muted); }
.oct-exp { font-size: .95rem; }
.capot-foot { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.capot-hint { font-size: .86rem; color: var(--muted); }

.b-encadre { display: grid; gap: 7px; padding: 18px 20px; border-radius: 12px; border: 1px solid var(--rule); background: var(--panel); }
.b-encadre h3 { font-size: 1.15rem; }
.enc-lbl { font: 700 .74rem/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; }
.v-piege { border-color: var(--rose-line); background: var(--wash-rose); } .v-piege .enc-lbl { color: var(--rose); }
.v-cible { border-color: var(--amber-line); background: var(--wash-amber); } .v-cible .enc-lbl { color: var(--amber); }
.v-astuce { border-color: var(--green-line); background: var(--wash-green); } .v-astuce .enc-lbl { color: var(--green); }
.v-curieux { border-color: var(--cyan-line); background: var(--wash-cyan); } .v-curieux .enc-lbl { color: var(--cyan); }

.b-anglais, .b-jeux { display: grid; gap: 12px; }
.mots { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(210px, 100%), 1fr)); gap: 10px; margin: 0; }
.mot { display: grid; gap: 4px; align-content: start; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 10px; }
.mot dt { font: 600 1.02rem/1.25 var(--font-mono); color: var(--cyan); }
.mot dd { margin: 0; display: grid; gap: 3px; }

.mot .note { color: var(--muted); font-size: .92rem; line-height: 1.45; }
.jeux { list-style: none; margin: 0; padding: 0; display: grid; }

.jeu-tile { width: 50px; height: 50px; border-radius: 10px; display: grid; place-items: center; background: var(--panel-2); font: 700 .95rem/1 var(--font-display); letter-spacing: .04em; color: var(--amber); }

.b-atoi { display: grid; gap: 14px; padding: 24px; border-radius: 16px; border: 1px solid var(--amber-line); background: var(--wash-amber); }
.atoi-lbl { font: 700 .78rem/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--amber); }
.b-atoi > .btn { justify-self: start; }
.etapes { margin: 0; padding-left: 1.5em; display: grid; gap: 9px; }
.etapes li { padding-left: 4px; }
.etapes li::marker { font-family: var(--font-mono); font-weight: 600; color: var(--amber); }
.indices, .solution { display: grid; gap: 8px; justify-items: start; }
.indice, .sol-body { padding: 11px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--rule); }
.sol-body { border-color: var(--green-line); }
.indice .lbl { color: var(--amber); margin-right: 6px; }

.b-quiz { display: grid; gap: 4px; }
.q { display: grid; gap: 10px; padding-block: 16px; border-top: 1px solid var(--rule); }
.q-t { font-weight: 700; font-size: 1.07rem; }
.q-n { font: 600 .8rem/1 var(--font-mono); color: var(--amber); margin-right: 8px; }
.q-choix, .fc-choix, .fc-vf { display: grid; gap: 8px; }
.fc-vf { grid-template-columns: 1fr 1fr; }
.choix {
  text-align: left; min-height: 46px; padding: 10px 14px; border-radius: 10px;
  border: 1px solid var(--rule); background: var(--panel); color: var(--text);
  font: 400 1rem/1.4 var(--font-body); cursor: pointer; transition: border-color .12s ease, background-color .12s ease;
}

.choix.is-ko { border-color: var(--rose); background: var(--rose-soft); }
.verdict { font-family: var(--font-display); letter-spacing: .02em; }
.res-ok .verdict { color: var(--green); }
.res-ko .verdict { color: var(--rose); }
.q-score { font-weight: 700; padding-top: 10px; }

.b-resume { display: grid; gap: 10px; padding: 22px 24px; border-radius: 14px; background: var(--panel); border: 1px solid var(--rule); }
.b-resume ul { margin: 0; padding-left: 1.2em; display: grid; gap: 7px; }
.b-resume li::marker { color: var(--amber); }
.b-suite { display: grid; gap: 6px; }
.b-suite h3 { font-size: 1.15rem; }

.fin-lecon { display: grid; gap: 14px; justify-items: start; padding-top: 26px; border-top: 1px solid var(--rule); }
.done-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; }
.done-row > svg { color: var(--green); margin-top: 4px; }
.done-row p { color: var(--muted); }
.coach, .pasclair { display: grid; gap: 10px; }
.coach h2, .pasclair h2 { font-size: 1.2rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
textarea {
  width: 100%; min-height: 84px; padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--rule); background: var(--panel); color: var(--text);
  font: 400 1rem/1.5 var(--font-body); resize: vertical;
}
.reponse { white-space: pre-wrap; line-height: 1.6; padding: 14px 16px; border-radius: 10px; background: var(--panel); border: 1px solid var(--rule); }
.reponse:empty { display: none; }
.err { display: block; color: var(--rose); margin-top: 6px; }
.ok-msg { color: var(--green); font-weight: 600; }

/* ---------- Glossaire, bestiaire, règles, progression ---------- */
.search input {
  width: 100%; max-width: 420px; min-height: 46px; padding: 10px 14px; border-radius: 10px;
  border: 1px solid var(--rule); background: var(--panel); color: var(--text); font: inherit;
}
.gloss { margin: 0; }
.g-item { display: grid; grid-template-columns: minmax(0, 14rem) minmax(0, 1fr); gap: 6px 26px; padding-block: 15px; border-top: 1px solid var(--rule); }
.g-item dt { display: grid; gap: 4px; align-content: start; }
.g-t { font-weight: 700; font-size: 1.05rem; }
.g-en { font: 400 .88rem/1.3 var(--font-mono); color: var(--cyan); }
.g-lec { font: 600 .68rem/1.2 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }

.g-item dd { margin: 0; display: grid; gap: 6px; }
.g-ex { color: var(--muted); font-size: .95rem; }
.best { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 14px; }
.b-fiche { display: grid; gap: 8px; align-content: start; padding: 18px 20px; border-radius: 12px; border: 1px solid var(--rule); background: var(--panel); }
.b-fiche header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }

.b-fiche summary { cursor: pointer; font-weight: 700; color: var(--amber); padding-block: 4px; }
.b-fiche dl { margin: 6px 0 0; display: grid; gap: 3px; }
.b-fiche dt { margin-top: 8px; font: 600 .72rem/1.4 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.b-fiche dd { margin: 0; }
.regles { display: grid; }
.regle { display: grid; gap: 6px; padding-block: 20px; border-top: 1px solid var(--rule); }
.regle h2 { font-size: 1.2rem; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 12px; }
.stat { display: grid; gap: 5px; padding: 16px 18px; border: 1px solid var(--rule); border-radius: 12px; }
.stat .v { font: 700 2rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.stat .k { color: var(--muted); font-size: .92rem; }
.moi-sec { display: grid; gap: 12px; }
.moi-sec h2 { font-size: 1.25rem; }
.moi-list { list-style: none; margin: 0; padding: 0; }
.moi-list li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; padding-block: 11px; border-top: 1px solid var(--rule); }
.field { display: grid; grid-template-columns: 7.5rem minmax(0, 18rem); gap: 12px; align-items: center; }
select { min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--rule); background: var(--panel); color: var(--text); font: inherit; }
.confirm { display: grid; gap: 10px; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 640px) {
  .g-item { grid-template-columns: minmax(0, 1fr); }
  .lec { grid-template-columns: 2.4rem minmax(0, 1fr) auto; }
  .lec .ld { display: none; }
  .ph { grid-template-columns: 2.6rem 18px minmax(0, 1fr); column-gap: 10px; }
  .ph::before { left: calc(2.6rem + 10px + 8px); }
  .reprendre { padding: 22px 20px; }
  .field { grid-template-columns: minmax(0, 1fr); gap: 6px; }
}

/* ---------- Coque téléphone ---------- */
html.is-tel { height: 100%; box-sizing: border-box; }
html.is-tel body { height: 100%; overflow: hidden; }
html.is-tel #app { height: 100%; }
.tel { height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
.vue-tel { min-height: 0; overflow-y: auto; overscroll-behavior-y: contain; }
.vue-tel.is-feed { overflow: hidden; }
.tel .page, .tel .lecon {
  padding-block: 22px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tel .page { gap: 34px; }
.tabs {
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--panel); border-top: 1px solid var(--rule);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}

  display: grid; justify-items: center; align-content: center; gap: 5px; min-height: 58px;
  color: var(--muted); text-decoration: none;
  font: 600 .68rem/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase;
}
.tabs a[aria-current="page"] { color: var(--amber); }

/* ---------- Le scroll ---------- */
.feed-wrap { position: relative; height: 100%; }
.feed { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior-y: contain; scrollbar-width: none; }
.feed::-webkit-scrollbar { display: none; }
.fcard { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; background: var(--ink); border-bottom: 1px solid var(--rule); --type-c: var(--amber); }
.fc-in {
  height: 100%; max-width: 560px; margin: 0 auto;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 16px;
  padding-block: 54px 18px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.fc-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.fc-type { font: 700 .78rem/1 var(--font-display); letter-spacing: .15em; text-transform: uppercase; color: var(--type-c); }
.fc-jeu { font: 600 .68rem/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--rule); border-radius: 999px; padding: 5px 9px; }
.fc-main { min-height: 0; overflow-y: auto; display: grid; align-content: center; gap: 16px; }
.fc-titre { font: 700 clamp(1.55rem, 6.6vw, 2.2rem)/1.12 var(--font-display); }
.fc-q { font-size: clamp(1.3rem, 5.4vw, 1.75rem); line-height: 1.2; }
.fc-kicker { font: 700 .95rem/1.3 var(--font-body); color: var(--muted); }
.fc-texte { font-size: 1.14rem; line-height: 1.52; }
.fc-texte.muted { font-size: 1rem; }
.fc-exp { font-size: 1.02rem; line-height: 1.5; padding: 12px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--rule); }
.fc-code { font-size: .96rem; }
.fc-lang { font: 600 .7rem/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.fc-rep { display: grid; gap: 10px; padding: 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--green-line); }
.fc-en { font: 700 clamp(2rem, 10vw, 3rem)/1.05 var(--font-display); overflow-wrap: anywhere; }
.fc-flip { display: grid; gap: 16px; }
.fc-fr { display: grid; gap: 10px; }
.fc-frw { font: 700 1.6rem/1.15 var(--font-display); color: var(--amber); }
.fc-capot { display: grid; gap: 8px; }
.fc-arrow { font: 700 .7rem/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--cyan); text-align: center; }
.fc-act { display: grid; gap: 8px; }
.fc-act .after { display: grid; gap: 8px; }
.t-quiz, .t-vraifaux { --type-c: var(--amber); }
.t-concept { --type-c: var(--amber); }
.t-code { --type-c: var(--cyan); background: var(--code-bg); }
.t-capot, .t-anglais { --type-c: var(--cyan); background: var(--wash-cyan); }
.t-savaistu, .t-fin { --type-c: var(--green); background: var(--wash-green); }
.t-bestiaire { --type-c: var(--rose); background: var(--wash-rose); }
.t-regle { --type-c: var(--amber); background: var(--wash-amber); }
.hud {
  position: absolute; z-index: 5; top: 12px;
  left: max(20px, env(safe-area-inset-left, 0px)); right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: center; pointer-events: none;
  font: 600 .8rem/1 var(--font-display); letter-spacing: .05em; color: var(--muted);
}
.hud-serie { display: inline-flex; align-items: center; gap: 6px; color: var(--amber); }
.hud-dose { display: inline-flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.hud .bar { display: inline-block; width: 70px; height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.hud .bar > span { display: block; height: 100%; background: var(--amber); transition: width .3s ease; }
.swipe-hint { display: flex; justify-content: center; align-items: center; gap: 6px; padding-top: 4px; color: var(--faint); font: 600 .74rem/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.sheet-root:empty { display: none; }
.sheet { position: absolute; inset: 0; z-index: 30; display: grid; align-items: end; background: var(--scrim); }
.sheet-in {
  display: grid; gap: 12px; max-height: 82%; overflow-y: auto;
  padding: 22px max(20px, env(safe-area-inset-right, 0px)) 22px max(20px, env(safe-area-inset-left, 0px));
  background: var(--panel); border-top: 1px solid var(--rule); border-radius: 18px 18px 0 0;
}
.sheet-in h3 { font-size: 1.25rem; }
.sheet-in p { color: var(--muted); }
.sheet-rep { white-space: pre-wrap; line-height: 1.55; color: var(--text); }
.sheet-rep:empty { display: none; }

/* ---------- Marque, progression de phase, confort de lecture ---------- */
.wordmark .brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 30px; height: 30px; flex: none; color: var(--amber); }
.boot .brand-mark { width: 44px; height: 44px; display: block; margin: 0 auto 14px; }
.phase-prog { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.phase-prog .lbl { color: var(--muted); }
.cells { display: flex; gap: 4px; }
.cell { width: 26px; height: 10px; border-radius: 3px; background: var(--rule); }
.cell.ok { background: var(--green); }
.cell.cur { background: var(--amber); }
.readbar { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; height: 3px; z-index: 40; pointer-events: none; }
.readbar > span { display: block; height: 100%; width: 0; background: var(--amber); }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 5px var(--amber-soft); } 50% { box-shadow: 0 0 0 10px transparent; } }
.ph.is-encours .ph-node { animation: pulse 2.6s ease-in-out infinite; }
.toc { display: none; }
@media (min-width: 1180px) {
  .shell .lecon-grid { display: grid; grid-template-columns: minmax(0, 74ch) 200px; gap: 44px; align-items: start; }
  .shell .toc { display: grid; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 26px); }
}
.toc .lbl { color: var(--muted); margin-bottom: 8px; }
.toc button {
  text-align: left; background: none; border: 0; border-left: 2px solid var(--rule);
  padding: 5px 0 5px 12px; color: var(--muted); font: 600 .88rem/1.35 var(--font-body); cursor: pointer;
}
.toc button:hover { color: var(--text); }
.toc button.on { color: var(--text); border-left-color: var(--amber); }
.lecon.is-boss .lecon-head { border-bottom-color: var(--rose-line); }
.chip.boss { color: var(--rose); border-color: var(--rose-line); }
.code-wrap { position: relative; min-width: 0; }
.copy {
  position: absolute; top: 8px; right: 8px; min-height: 30px; padding: 4px 10px; border-radius: 7px;
  border: 1px solid var(--rule); background: var(--panel); color: var(--muted); cursor: pointer;
  font: 600 .74rem/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase;
}
.copy:hover { color: var(--text); border-color: var(--amber-line); }
.lecon-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.lecon-nav a, .lecon-nav .vide {
  display: grid; gap: 4px; align-content: start; padding: 14px 16px; min-width: 0;
  border: 1px solid var(--rule); border-radius: 12px; color: var(--text); text-decoration: none;
}
.lecon-nav a:hover { border-color: var(--amber-line); }
.lecon-nav .vide { border-style: dashed; color: var(--faint); }
.lecon-nav .k { font: 600 .72rem/1.2 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lecon-nav .t { font-weight: 700; overflow-wrap: anywhere; }
.lecon-nav .suiv { text-align: right; }
.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); z-index: 50;
  padding: 10px 16px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--amber-line); color: var(--text); font-weight: 600;

  let TOC_ITEMS = [], tocIO = null;
  function buildToc() {
    const toc = $('#toc'); if (!toc) return;
    if (tocIO) { tocIO.disconnect(); tocIO = null; }
    const items = $$('.lecon .b-texte, .lecon .b-capot, .lecon .b-jeux, .lecon .b-anglais, .lecon .b-atoi, .lecon .b-quiz, .lecon .b-resume').map((el) => {
      const h = el.querySelector('h2');

      if (el.classList.contains('b-capot')) t = 'Sous le capot';
      if (el.classList.contains('b-atoi')) t = 'À toi';
      return t ? { el, t } : null;
    }).filter(Boolean);
    TOC_ITEMS = items.map((it) => it.el);
    if (items.length < 3) { toc.innerHTML = ''; return; }
    toc.innerHTML = '<span class="lbl">Dans cette leçon</span>' + items.map((it, k) => '<button data-act="toc" data-k="' + k + '">' + esc(it.t) + '</button>').join('');
    if ('IntersectionObserver' in window) {
      tocIO = new IntersectionObserver((entries) => {
        entries.forEach((en) => {
          if (!en.isIntersecting) return;
          const k = TOC_ITEMS.indexOf(en.target);
          $$('#toc button').forEach((b, j) => b.classList.toggle('on', j === k));
        });
      }, { rootMargin: '0px 0px -65% 0px' });
      TOC_ITEMS.forEach((el) => tocIO.observe(el));
    }
  }

  function finishLecon(id) {
    const qs = $$('.b-quiz .q');

    const ok = qs.filter((q) => q.classList.contains('res-ok')).length;
    const prev = Store.prog.lecons[id] || {};
    const lecons = Object.assign({}, Store.prog.lecons);
    lecons[id] = { fini: prev.fini || today(), quiz: answered ? { score: ok, total: qs.length } : (prev.quiz || null) };
    Store.prog.lecons = lecons;
    Store.saveProg();

  function answerQuiz(btn) {
    const q = btn.closest('.q'); if (!q || q.classList.contains('answered')) return;
    const bonne = +q.dataset.bonne, ci = +btn.dataset.ci, ok = ci === bonne;
    $$('.choix', q).forEach((b, k) => { b.disabled = true; if (k === bonne) b.classList.add('is-ok'); });
    if (!ok) btn.classList.add('is-ko');
    q.classList.add('answered', ok ? 'res-ok' : 'res-ko');
    const exp = $('.q-exp', q);
    if (exp) { exp.hidden = false; exp.insertAdjacentHTML('afterbegin', '<strong class="verdict">' + (ok ? 'Exact.' : 'Pas tout à fait.') + '</strong> '); }
    const quiz = q.closest('.b-quiz');
    const all = $$('.q', quiz);
    if (all.every((x) => x.classList.contains('answered'))) {
      const s = all.filter((x) => x.classList.contains('res-ok')).length;
      const out = $('.q-score', quiz);
      out.hidden = false;
      out.textContent = 'Score : ' + s + '/' + all.length + (s === all.length ? '. Parfait.' : (s * 2 >= all.length ? '. Bien joué.' : '. Relis les explications : les cartes du scroll t\'aideront à fixer tout ça.'));
    }
  }

  let coachCtl = null, sheetCtl = null;
  function sampleError(e) {
    const code = e && e.code;
    if (code === 'cancelled') return '';
    if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].indexOf(code) >= 0) { SAMPLE_OFF = true; return 'Les réponses de Claude ne sont pas disponibles ici.'; }
    if (code === 'rate_limited') return 'Trop de demandes d\'un coup : réessaie dans un moment.';
    if (code === 'session_expired') return 'Reconnecte-toi à Claude, puis réessaie.';
    if (code === 'refused') return 'Claude ne peut pas répondre à cette question-là.';
    return 'La réponse n\'a pas pu arriver. Réessaie.';
  }

  async function askLecon(id) {
    const L = C.lecons[id]; if (!L || !SAMPLE) return;
    const ta = $('#q-lecon'); const q = ta.value.trim();
    if (!q) { ta.focus(); return; }
    const out = $('#coach-rep'), go = $('#coach [data-act="demander"]'), stop = $('#coach [data-act="stop"]');
    go.disabled = true; stop.hidden = false; out.textContent = 'Je réfléchis…';
    coachCtl = new AbortController();
    const prompt = 'Tu es le coach de programmation d\'une personne qui débute en C++ : son but est de comprendre le code des jeux vidéo (Minecraft, Oblivion, GTA V, Garry\'s Mod). Elle lit la leçon ci-dessous et te pose une question. Réponds en français, en la tutoyant, en 3 à 8 phrases courtes et claires, sans jargon non expliqué. Reste dans le sujet ; si la question porte sur la triche en ligne ou le crack d\'un jeu, explique gentiment que le cours reste hors-ligne, sur ses propres programmes et des cibles autorisées. N\'emploie aucun adjectif genré pour parler de cette personne. Pas d\'émoji, pas de titre.\n\nLEÇON :\n' + lessonText(L).slice(0, 7000) + '\n\nQUESTION :\n' + q.slice(0, 1500);
    try {
      const res = await SAMPLE(prompt, { signal: coachCtl.signal, onText: (u) => { out.textContent = u.text; } });
      out.textContent = res.text;
    } catch (e) {
      out.textContent = (e && e.text) || '';
      const m = sampleError(e);
      if (m) out.insertAdjacentHTML('beforeend', '<span class="err">' + esc(m) + '</span>');

  const MEMO = [

  function buildQueue(n, exclude) {
    const t = today(), st = Store.srs.cartes || {};
    const open = C.cartes.filter((c) => cardOpen(c) && !exclude.has(c.id));
    const pools = {
      due: open.filter((c) => st[c.id] && !INFO.has(c.type) && st[c.id].d <= t).sort((a, b) => (st[a.id].d < st[b.id].d ? -1 : 1)),
      learn: open.filter((c) => !st[c.id] && !INFO.has(c.type) && c.type !== 'code'),
      code: open.filter((c) => !st[c.id] && c.type === 'code'),
      info: open.filter((c) => !st[c.id] && INFO.has(c.type)),
    };
    const pattern = ['due', 'learn', 'learn', 'info', 'due', 'code', 'learn', 'info'];
    const out = [];
    for (let i = 0; out.length < n && i < 400; i++) {
      let c = pools[pattern[i % pattern.length]].shift();
      if (!c) { const k = ['due', 'learn', 'code', 'info'].find((x) => pools[x].length); if (!k) break; c = pools[k].shift(); }
      out.push(c);
    }
    return out;
  }
  function reviewRandom(n, exclude) {
    const st = Store.srs.cartes || {};

      .sort((a, b) => (st[a.id].d < st[b.id].d ? -1 : 1)).slice(0, n);

  function observeFeed() {
    const root = $('#feed'); if (!root || !('IntersectionObserver' in window)) return;
    Feed.io = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        const el = en.target;
        if (en.isIntersecting && en.intersectionRatio >= 0.7) {
          if (!Feed.timers.has(el)) Feed.timers.set(el, setTimeout(() => { Feed.timers.delete(el); markViewed(el); }, 1500));
        } else if (Feed.timers.has(el)) { clearTimeout(Feed.timers.get(el)); Feed.timers.delete(el); }
      });
    }, { root, threshold: [0, 0.7, 1] });
    $$('.fcard[data-id]', root).forEach((el) => Feed.io.observe(el));
  }
  function bumpSerie() {
    const t = today();

    if (s.jour === t) return;
