<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>CZKLearning</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Concept : l'établi du démonteur. PC : rail d'outils à gauche + colonne de lecture. Téléphone : cartes plein écran qu'on fait défiler.
   Motif : la flèche du débogueur (le pointeur d'instruction) marque « là où tu en es » ; les phases sont numérotées en hexadécimal. */
:root {
  --ink: #0f1218;
  --panel: #161a22;
  --panel-2: #1e2331;
  --code-bg: #0b0e14;
  --rule: #2a3140;
  --text: #e8e5de;
  --muted: #9aa2b2;
  --faint: #6f788b;
  --amber: #f2b33d;
  --accent-fill: #f2b33d;
  --on-accent: #241800;
  --amber-soft: rgba(242, 179, 61, .14);
  --amber-line: rgba(242, 179, 61, .45);
  --cyan: #67d3ea;
  --cyan-soft: rgba(103, 211, 234, .13);
  --cyan-line: rgba(103, 211, 234, .40);
  --rose: #ff8f7a;
  --rose-soft: rgba(255, 143, 122, .13);
  --rose-line: rgba(255, 143, 122, .42);
  --green: #7fd69a;
  --green-soft: rgba(127, 214, 154, .13);
  --green-line: rgba(127, 214, 154, .42);
  --wash-cyan: #0f1a21;
  --wash-green: #0f1a15;
  --wash-rose: #1d1315;
  --wash-amber: #1c170d;
  --scrim: rgba(4, 6, 9, .62);
  --qr-bg: #ffffff;
  --t-kw: #ffb86b; --t-str: #a9e5a3; --t-num: #f2b33d; --t-com: #7f889a; --t-reg: #67d3ea;
  --t-mn: #f6f1e6; --t-dir: #c4a5ff; --t-pre: #ff9ec4; --t-lbl: #8fc7ff;
  --font-display: "Chakra Petch", "Bahnschrift", "Segoe UI", sans-serif;
  --font-body: "Atkinson Hyperlegible Next", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Atkinson Hyperlegible Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ink: #f1f3f6; --panel: #ffffff; --panel-2: #e8ebf1; --code-bg: #f7f8fb; --rule: #d3d8e2;
    --text: #161a22; --muted: #566074; --faint: #747c8e;
    --amber: #8f5a00; --accent-fill: #e9a73a; --on-accent: #231600;
    --amber-soft: rgba(212, 140, 20, .14); --amber-line: rgba(160, 100, 0, .45);
    --cyan: #0b6f84; --cyan-soft: rgba(11, 111, 132, .10); --cyan-line: rgba(11, 111, 132, .35);
    --rose: #b8432f; --rose-soft: rgba(184, 67, 47, .09); --rose-line: rgba(184, 67, 47, .35);
    --green: #1e7f45; --green-soft: rgba(30, 127, 69, .10); --green-line: rgba(30, 127, 69, .35);
    --wash-cyan: #e8f3f6; --wash-green: #eaf5ee; --wash-rose: #f8ecea; --wash-amber: #f8f0df;
    --scrim: rgba(20, 24, 32, .45); --qr-bg: #ffffff;
    --t-kw: #a04d00; --t-str: #2f7d32; --t-num: #8f5a00; --t-com: #737b8c; --t-reg: #0b6f84;
    --t-mn: #161a22; --t-dir: #6b44b8; --t-pre: #b3306e; --t-lbl: #1f5fa8;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --ink: #f1f3f6; --panel: #ffffff; --panel-2: #e8ebf1; --code-bg: #f7f8fb; --rule: #d3d8e2;
  --text: #161a22; --muted: #566074; --faint: #747c8e;
  --amber: #8f5a00; --accent-fill: #e9a73a; --on-accent: #231600;
  --amber-soft: rgba(212, 140, 20, .14); --amber-line: rgba(160, 100, 0, .45);
  --cyan: #0b6f84; --cyan-soft: rgba(11, 111, 132, .10); --cyan-line: rgba(11, 111, 132, .35);
  --rose: #b8432f; --rose-soft: rgba(184, 67, 47, .09); --rose-line: rgba(184, 67, 47, .35);
  --green: #1e7f45; --green-soft: rgba(30, 127, 69, .10); --green-line: rgba(30, 127, 69, .35);
  --wash-cyan: #e8f3f6; --wash-green: #eaf5ee; --wash-rose: #f8ecea; --wash-amber: #f8f0df;
  --scrim: rgba(20, 24, 32, .45); --qr-bg: #ffffff;
  --t-kw: #a04d00; --t-str: #2f7d32; --t-num: #8f5a00; --t-com: #737b8c; --t-reg: #0b6f84;
  --t-mn: #161a22; --t-dir: #6b44b8; --t-pre: #b3306e; --t-lbl: #1f5fa8;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --ink: #0f1218; --panel: #161a22; --panel-2: #1e2331; --code-bg: #0b0e14; --rule: #2a3140;
  --text: #e8e5de; --muted: #9aa2b2; --faint: #6f788b;
  --amber: #f2b33d; --accent-fill: #f2b33d; --on-accent: #241800;
  --amber-soft: rgba(242, 179, 61, .14); --amber-line: rgba(242, 179, 61, .45);
  --cyan: #67d3ea; --cyan-soft: rgba(103, 211, 234, .13); --cyan-line: rgba(103, 211, 234, .40);
  --rose: #ff8f7a; --rose-soft: rgba(255, 143, 122, .13); --rose-line: rgba(255, 143, 122, .42);
  --green: #7fd69a; --green-soft: rgba(127, 214, 154, .13); --green-line: rgba(127, 214, 154, .42);
  --wash-cyan: #0f1a21; --wash-green: #0f1a15; --wash-rose: #1d1315; --wash-amber: #1c170d;
  --scrim: rgba(4, 6, 9, .62); --qr-bg: #ffffff;
  --t-kw: #ffb86b; --t-str: #a9e5a3; --t-num: #f2b33d; --t-com: #7f889a; --t-reg: #67d3ea;
  --t-mn: #f6f1e6; --t-dir: #c4a5ff; --t-pre: #ff9ec4; --t-lbl: #8fc7ff;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--text);
  font: 400 1.0625rem/1.6 var(--font-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--amber); text-underline-offset: 3px; }
code { font-family: var(--font-mono); font-size: .92em; }
p code, li code, dd code, .fc-texte code, .sub code {
  padding: .05em .35em; border-radius: 5px; background: var(--panel-2); color: var(--text);
}
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.eyebrow {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  font: 600 .78rem/1.3 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
}
.eyebrow .ip { color: var(--amber); display: inline-grid; }
.lbl { font: 700 .74rem/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; }

/* ---------- Boutons et puces ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  min-height: 44px; padding: .6em 1.1em; border-radius: 9px;
  border: 1px solid var(--rule); background: var(--panel); color: var(--text);
  font: 600 .98rem/1.2 var(--font-body); text-decoration: none; cursor: pointer;
  transition: border-color .15s ease, filter .15s ease, transform .1s ease;
}
.btn:hover { border-color: var(--amber-line); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; }
.btn.big { min-height: 52px; padding: .8em 1.4em; font-size: 1.05rem; }
.btn.wide { width: 100%; }
.btn.danger { border-color: var(--rose-line); color: var(--rose); background: transparent; }
.lnk {
  background: none; border: 0; padding: 6px 2px; color: var(--muted); cursor: pointer;
  font: 600 .92rem/1.2 var(--font-body); text-decoration: underline; text-underline-offset: 3px; justify-self: center;
}
.lnk:hover { color: var(--text); }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: .25em .65em; border-radius: 999px;
  border: 1px solid var(--rule); color: var(--muted);
  font: 600 .7rem/1.2 var(--font-display); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;
}
.chip.cur { color: var(--amber); border-color: var(--amber-line); }
.chip.ok { color: var(--green); border-color: var(--green-line); }

/* ---------- Démarrage ---------- */
.boot { min-height: 70vh; display: grid; place-items: center; padding: 24px; text-align: center; }
.boot .wm { font: 700 2rem/1 var(--font-display); }
.boot p { color: var(--muted); margin-top: 10px; }

/* ---------- Coque PC ---------- */
.shell {
  display: grid; grid-template-columns: 228px minmax(0, 1fr); gap: 52px;
  max-width: 1220px; margin: 0 auto;
  padding-block: 30px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 26px); align-self: start; display: grid; gap: 26px; }
.wordmark { display: grid; gap: 7px; color: var(--text); text-decoration: none; }
.wm { font: 700 1.55rem/1 var(--font-display); letter-spacing: .01em; }
.wm-sub { font: 400 .82rem/1.25 var(--font-mono); color: var(--amber); }
.nav { display: grid; gap: 2px; }
.nav a {
  display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 8px; align-items: center;
  padding: 8px 10px 8px 6px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 600;
}
.nav a .ipm { color: var(--amber); display: grid; place-items: center; visibility: hidden; }
.nav a:hover { color: var(--text); }
.nav a[aria-current="page"] { color: var(--text); background: var(--panel); }
.nav a[aria-current="page"] .ipm { visibility: visible; }
.sync { font-size: .82rem; color: var(--faint); line-height: 1.45; }
.phone-card { display: grid; gap: 10px; padding: 16px; border: 1px solid var(--rule); border-radius: 12px; }
.phone-card p { font-size: .9rem; color: var(--muted); line-height: 1.5; }
.qr { background: var(--qr-bg); padding: 8px; border-radius: 8px; width: 136px; }
.qr.big { width: 220px; }
.qr svg, .qr img { display: block; width: 100%; height: auto; }
@media (max-width: 920px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 28px; padding-block: 20px 64px; }
  .rail { position: static; gap: 14px; }
  .nav { display: flex; flex-wrap: wrap; gap: 4px; }
  .nav a { grid-template-columns: auto; padding: 6px 10px; }
  .nav a .ipm { display: none; }
  .phone-card, .sync { display: none; }
}

/* ---------- Pages ---------- */
.page { display: grid; gap: 44px; min-width: 0; }
.page.narrow { max-width: 760px; }
.vh { display: grid; gap: 12px; }
.vh h1, .reprendre h1, .lecon-head h1 { font-size: clamp(1.8rem, 1.15rem + 2.1vw, 2.65rem); line-height: 1.08; }
.sub { color: var(--muted); max-width: 64ch; }

.reprendre {
  display: grid; gap: 14px; padding: 28px 30px;
  border: 1px solid var(--rule); border-radius: 16px; background: var(--panel);
}
.reprendre .meta { color: var(--muted); }
.reprendre .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; margin-top: 4px; }
.inline-stats { color: var(--muted); font-size: .95rem; font-variant-numeric: tabular-nums; }
.sec { display: grid; gap: 18px; }
.sec-head { display: grid; gap: 8px; }
.sec-head h2 { font-size: 1.5rem; }

/* La carte du parcours : une table d'adresses mémoire */
.map { list-style: none; margin: 0; padding: 0; }
.ph { display: grid; grid-template-columns: 3.2rem 18px minmax(0, 1fr); column-gap: 14px; position: relative; padding-block: 13px; }
.ph::before { content: ""; position: absolute; left: calc(3.2rem + 14px + 8px); top: 0; bottom: 0; width: 2px; background: var(--rule); }
.ph:first-child::before { top: 24px; }
.ph:last-child::before { bottom: auto; height: 24px; }
.ph-addr { font: 400 .86rem/1.5 var(--font-mono); color: var(--faint); text-align: right; padding-top: 3px; }
.ph-node { width: 18px; height: 18px; margin-top: 5px; border-radius: 50%; border: 2px solid var(--faint); background: var(--ink); position: relative; z-index: 1; }
.ph.is-encours .ph-node { border-color: var(--amber); background: var(--amber); box-shadow: 0 0 0 5px var(--amber-soft); }
.ph.is-faite .ph-node { border-color: var(--green); background: var(--green); }
.ph.is-encours .ph-addr { color: var(--amber); }
.ph-body { display: grid; gap: 6px; min-width: 0; }
.ph-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ph-top h3 { font-size: 1.2rem; }
.ph-duree { margin-left: auto; font: 400 .84rem/1.2 var(--font-mono); color: var(--faint); }
.ph-sauras { max-width: 62ch; }
.ph-boss { color: var(--muted); font-size: .97rem; max-width: 62ch; }
.ph-boss .lbl { color: var(--rose); margin-right: 6px; }
.ph.is-verrou h3, .ph.is-verrou .ph-sauras { color: var(--muted); }
.ph.is-verrou .ph-boss { color: var(--faint); }
.ph-lecons { list-style: none; margin: 10px 0 2px; padding: 0; display: grid; gap: 7px; }
.lec {
  display: grid; grid-template-columns: 2.8rem minmax(0, 1fr) auto auto; gap: 12px; align-items: center;
  padding: 11px 14px; border: 1px solid var(--rule); border-radius: 10px;
  background: var(--panel); color: var(--text); text-decoration: none;
}
a.lec:hover { border-color: var(--amber-line); }
.lec.is-next { border-color: var(--amber-line); background: var(--amber-soft); }
.lec.is-off { background: transparent; border-style: dashed; color: var(--muted); }
.lnum { font: 600 .9rem/1 var(--font-mono); color: var(--amber); }
.lec.is-off .lnum { color: var(--faint); }
.ld { font: 400 .82rem/1 var(--font-mono); color: var(--faint); white-space: nowrap; }
.lst { display: inline-flex; align-items: center; gap: 4px; font: 600 .7rem/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
.lst.cur { color: var(--amber); }
.lst.ok { color: var(--green); }
.fils { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 14px; }
.fil { display: grid; gap: 7px; align-content: start; padding: 18px 20px; border: 1px solid var(--rule); border-radius: 12px; }
.fil h3 { font-size: 1.05rem; }
.fil p { color: var(--muted); font-size: .96rem; }
.fil .lnk { justify-self: start; }

/* ---------- Leçon ---------- */
.lecon { display: grid; gap: 32px; max-width: 74ch; min-width: 0; }
.back { justify-self: start; color: var(--muted); font-weight: 600; text-decoration: none; }
.back:hover { color: var(--text); }
.tel-note { padding: 12px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--rule); color: var(--muted); font-size: .95rem; }
.lecon-head { display: grid; gap: 14px; padding-bottom: 24px; border-bottom: 1px solid var(--rule); }
.lecon-head .addr { font-family: var(--font-mono); color: var(--amber); letter-spacing: 0; }
.lecon-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); }
.lecon-meta .dur { font-family: var(--font-mono); color: var(--text); }
.b-accroche { font-size: 1.33rem; line-height: 1.5; text-wrap: pretty; }
.b-texte { display: grid; gap: 12px; }
.b-texte h2, .b-anglais h2, .b-jeux h2, .b-atoi h2, .b-quiz h2, .b-resume h2 { font-size: 1.45rem; }
.b-texte p { text-wrap: pretty; }

.b-schema { margin: 0; display: grid; gap: 12px; }
.flow { display: grid; grid-template-columns: minmax(0, 1fr) 26px minmax(0, 1fr) 26px minmax(0, 1fr) 26px minmax(0, 1fr); align-items: stretch; }
.fnode { display: grid; gap: 6px; align-content: start; padding: 14px; border: 1px solid var(--rule); border-radius: 12px; background: var(--panel); min-width: 0; }
.fnode.tool { border-color: var(--amber-line); background: var(--wash-amber); }
.fnode.cpu { border-color: var(--cyan-line); background: var(--wash-cyan); }
.fk { font: 700 .72rem/1.2 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.fnode.tool .fk { color: var(--amber); }
.fnode.cpu .fk { color: var(--cyan); }
.fv { font: 700 1.05rem/1.2 var(--font-display); overflow-wrap: anywhere; }
code.fv { font-family: var(--font-mono); font-weight: 600; font-size: 1rem; }
.fd { font-size: .88rem; color: var(--muted); line-height: 1.4; }
.fd.bytes { font-family: var(--font-mono); color: var(--cyan); letter-spacing: .02em; }
.farrow { align-self: center; justify-self: center; width: 100%; height: 2px; background: var(--faint); position: relative; }
.farrow::after { content: ""; position: absolute; right: -2px; top: -5px; border: 6px solid transparent; border-left-color: var(--faint); }
.b-schema figcaption { color: var(--muted); font-size: .95rem; }
@media (max-width: 720px) {
  .flow { grid-template-columns: minmax(0, 1fr); }
  .farrow { width: 2px; height: 22px; }
  .farrow::after { right: auto; left: -5px; top: auto; bottom: -6px; border-left-color: transparent; border-top-color: var(--faint); }
}

.code {
  margin: 0; background: var(--code-bg); border: 1px solid var(--rule); border-radius: 10px;
  padding-block: 12px; overflow-x: auto; font: 400 .95rem/1.7 var(--font-mono); tab-size: 4;
}
.code code { display: grid; min-width: max-content; font: inherit; }
.cl { display: grid; grid-template-columns: 2.2ch minmax(0, 1fr); gap: 14px; padding-inline: 10px 18px; border-left: 3px solid transparent; transition: background-color .12s ease; }
.cn { color: var(--faint); text-align: right; user-select: none; }
.cc { white-space: pre; }
.cl.hi { background: var(--amber-soft); }
.cl.g { cursor: pointer; }
.cl.g0 { border-left-color: var(--amber-line); }
.cl.g1 { border-left-color: var(--cyan-line); }
.cl.g2 { border-left-color: var(--green-line); }
.cl.g3 { border-left-color: var(--rose-line); }
.cl.g0.on, .cl.on { background: var(--amber-soft); }
.cl.g1.on { background: var(--cyan-soft); }
.cl.g2.on { background: var(--green-soft); }
.cl.g3.on { background: var(--rose-soft); }
.t-kw { color: var(--t-kw); } .t-str { color: var(--t-str); } .t-num { color: var(--t-num); }
.t-com { color: var(--t-com); font-style: italic; } .t-reg { color: var(--t-reg); } .t-mn { color: var(--t-mn); font-weight: 600; }
.t-dir { color: var(--t-dir); } .t-pre { color: var(--t-pre); } .t-lbl { color: var(--t-lbl); }
.b-code { margin: 0; display: grid; gap: 10px; }
.b-code figcaption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; font-weight: 700; }
.lang { font: 600 .72rem/1.7 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.notes li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding: 8px 12px; border-radius: 8px; }
.notes li:hover { background: var(--panel); }
.nl { font: 600 .8rem/1.8 var(--font-mono); color: var(--amber); white-space: nowrap; }

.b-capot { display: grid; gap: 16px; padding: 24px; border: 1px solid var(--cyan-line); border-radius: 16px; background: var(--wash-cyan); min-width: 0; }
.capot-head { display: grid; gap: 6px; }
.capot-lbl { font: 700 .78rem/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); }
.capot-head h2 { font-size: 1.45rem; }
.capot-panes { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.35fr); gap: 12px; align-items: center; }
.pane { display: grid; gap: 8px; min-width: 0; align-self: stretch; align-content: start; }
.pane-lbl { font: 600 .72rem/1.35 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

    return C.parcours.phases.flatMap((p) => (p.lecons || []).map((l) => Object.assign({ phase: p.n, phaseNom: p.nom, hex: p.hex }, l)));
  }
  const isDone = (id) => !!(Store.prog.lecons && Store.prog.lecons[id] && Store.prog.lecons[id].fini);
  function nextLesson() { return lessons().find((l) => l.dispo && !isDone(l.id)) || null; }
  function currentPhase() {
    const n = nextLesson();
    if (n) return n.phase;
    const d = lessons().filter((l) => isDone(l.id));
    return d.length ? d[d.length - 1].phase : 1;
  }
  function cardOpen(c) {
    if (!c.lecon) return true;
    if (isDone(c.lecon)) return true;
    const n = nextLesson();
    return !!n && n.id === c.lecon;
  }
  function serieNow() {
    const s = Store.srs.serie || { n: 0, jour: '' };
    const t = today();
    return (s.jour === t || s.jour === addDays(t, -1)) ? (s.n || 0) : 0;
  }
  const masteredCount = () => Object.values(Store.srs.cartes || {}).filter((s) => (s.b || 0) >= 4).length;
  function dueCount() {
    const t = today(), st = Store.srs.cartes || {};
    return C.cartes.filter((c) => !INFO.has(c.type) && st[c.id] && st[c.id].d <= t).length;
  }
  function statsLine() {
    const done = lessons().filter((l) => isDone(l.id)).length;
    return plural(done, 'leçon terminée', 'leçons terminées') + ' · série de ' + plural(serieNow(), 'jour', 'jours') + ' · ' + plural(masteredCount(), 'carte maîtrisée', 'cartes maîtrisées');
  }
  function syncText() {
    return ({
      local: 'Progression gardée sur cet appareil.',
      loading: 'Synchronisation…',
      ok: 'Progression synchronisée entre ton PC et ton téléphone.',
      stale: 'Synchronisation impossible pour l\'instant : ta progression reste sur cet appareil.',
    })[Store.sync] || '';
  }

  /* ================= Mode, thème, coque ================= */
  let MODE = 'pc';
  let SAMPLE = null, SAMPLE_OFF = false;
  const HOSTED = !!(window.claude && typeof window.claude.use === 'function');
  const PHONE_URL = HOSTED ? ARTIFACT_URL : PAGES_URL;
  const HOST_THEME = document.documentElement.getAttribute('data-theme');
  function detectMode() {
    let forced = null;
    try { forced = new URLSearchParams(location.search).get('mode'); } catch (e) { forced = null; }
    const pref = forced || LS.get('mode', 'auto');
    if (pref === 'tel' || pref === 'pc') return pref;
    return window.matchMedia('(hover: none) and (pointer: coarse)').matches ? 'tel' : 'pc';
  }
  function applyTheme() {
    const t = LS.get('theme', 'auto');
    const root = document.documentElement;
    if (t === 'dark' || t === 'light') root.setAttribute('data-theme', t);
    else if (HOST_THEME) root.setAttribute('data-theme', HOST_THEME);
    else root.removeAttribute('data-theme');
  }
  function qrSVG(url) {
    if (!url || typeof window.qrcode !== 'function') return '';
    try { const q = window.qrcode(0, 'M'); q.addData(url); q.make(); return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); } catch (e) { return ''; }
  }
  function shellPC() {
    const qr = qrSVG(PHONE_URL);
    return '<div class="shell">' +
      '<aside class="rail" aria-label="Navigation">' +
        '<a class="wordmark" href="#accueil"><span class="wm">CZKLearning</span><span class="wm-sub" id="rail-phase"></span></a>' +
        '<nav class="nav" id="nav"></nav>' +
        '<p class="sync" id="sync" aria-live="polite"></p>' +
        (PHONE_URL ? '<div class="phone-card"><span class="lbl muted">Sur ton téléphone</span><p>Le scroll t\'attend sur ton téléphone : des cartes de vingt secondes pour réviser au lieu des réseaux.</p>' +
          (qr ? '<div class="qr">' + qr + '</div><p>' + (HOSTED ? 'Scanne avec l\'appareil photo, puis connecte-toi à Claude.' : 'Scanne avec l\'appareil photo de ton téléphone : le site s\'ouvre directement.') + '</p>' : '<p>Ouvre ce lien sur ton téléphone : ' + esc(PHONE_URL) + '</p>') +
        '</div>' : '') +
      '</aside>' +
      '<main class="vue" id="vue" tabindex="-1"></main>' +
    '</div>';
  }
  function shellTel() {
    return '<div class="tel"><main class="vue-tel" id="vue" tabindex="-1"></main><nav class="tabs" id="tabs" aria-label="Navigation"></nav></div>';
  }
  function renderNav(r) {
    const n = nextLesson();
    if (MODE === 'pc') {
      const nav = $('#nav'); if (!nav) return;
      const lecTarget = n ? 'lecon-' + n.id : (lessons().filter((l) => l.dispo).slice(-1)[0] ? 'lecon-' + lessons().filter((l) => l.dispo).slice(-1)[0].id : 'accueil');
      const items = [['accueil', 'Parcours'], [lecTarget, 'Leçon en cours'], ['glossaire', 'Glossaire'], ['bestiaire', 'Bestiaire des triches'], ['regles', 'Règles du dojo'], ['moi', 'Ma progression']];
      nav.innerHTML = items.map(([h, t], i) => {
        const cur = (i === 1 && r.view === 'lecon') || (i !== 1 && r.view === h);
        return '<a href="#' + h + '"' + (cur ? ' aria-current="page"' : '') + '><span class="ipm">' + ICON.ip + '</span><span>' + esc(t) + '</span></a>';
      }).join('');
      const p = C.parcours.phases.find((x) => x.n === currentPhase());
      const rp = $('#rail-phase'); if (rp && p) rp.textContent = p.hex + ' · ' + p.nom;
      const sy = $('#sync'); if (sy) sy.textContent = syncText();
    } else {
      const tabs = $('#tabs'); if (!tabs) return;
      const items = [['scroll', 'Scroll', ICON.scroll], ['accueil', 'Parcours', ICON.map], ['glossaire', 'Glossaire', ICON.book], ['moi', 'Moi', ICON.me]];
      tabs.innerHTML = items.map(([h, t, ic]) => {
        const cur = r.view === h || (h === 'accueil' && (r.view === 'lecon' || r.view === 'bestiaire' || r.view === 'regles'));
        return '<a href="#' + h + '"' + (cur ? ' aria-current="page"' : '') + '>' + ic + '<span>' + t + '</span></a>';
      }).join('');
    }
  }
  function route() {
    const h = (location.hash || '').replace(/^#/, '');
    if (/^lecon-\d+-\d+$/.test(h)) return { view: 'lecon', id: h.slice(6) };
    if (ROUTES.indexOf(h) >= 0) return { view: h };
    return { view: MODE === 'tel' ? 'scroll' : 'accueil' };
  }
  let lastKey = '';
  function render() {
    const r = route();
    const vue = $('#vue'); if (!vue) return;
    renderNav(r);
    const key = r.view + (r.id || '');
    if (r.view !== 'scroll') teardownFeed();
    vue.classList.toggle('is-feed', r.view === 'scroll' && MODE === 'tel');
    if (r.view === 'accueil') vue.innerHTML = viewAccueil();
    else if (r.view === 'lecon') { if (key !== lastKey || !$('.lecon[data-lecon]', vue)) { vue.innerHTML = '<div class="lecon"><p class="muted">Chargement de la leçon…</p></div>'; renderLecon(r.id); } }
    else if (r.view === 'glossaire') { vue.innerHTML = viewGlossaire(); bindGlossaire(); }
    else if (r.view === 'bestiaire') vue.innerHTML = viewBestiaire();
    else if (r.view === 'regles') vue.innerHTML = viewRegles();
    else if (r.view === 'moi') vue.innerHTML = viewMoi();
    else if (r.view === 'scroll') { if (MODE === 'tel') renderFeed(); else vue.innerHTML = viewScrollPC(); }
    if (key !== lastKey) {
      if (MODE === 'tel') vue.scrollTop = 0; else window.scrollTo(0, 0);
      lastKey = key;
    }
  }
  function mount() {
    MODE = detectMode();
    document.documentElement.classList.toggle('is-tel', MODE === 'tel');
    const app = $('#app');
    app.className = 'app ' + MODE;
    app.innerHTML = MODE === 'tel' ? shellTel() : shellPC();
    lastKey = '';
    render();
  }

  /* ================= Vue : parcours ================= */
  function viewAccueil() {
    const n = nextLesson();
    const cur = currentPhase();
    const done = lessons().filter((l) => isDone(l.id)).length;
    const head = n
      ? '<section class="reprendre"><div class="eyebrow"><span class="ip">' + ICON.ip + '</span>Prochaine étape · Phase ' + n.phase + ' · ' + esc(n.phaseNom) + '</div>' +
        '<h1>' + esc(n.numero) + ' · ' + esc(n.titre) + '</h1>' +
        '<p class="meta">' + n.duree + ' minutes. ' + (done ? 'On reprend là où tu en étais.' : 'La première leçon : aucune installation, tout se passe dans ton navigateur.') + '</p>' +
        '<div class="actions"><a class="btn primary big" href="#lecon-' + esc(n.id) + '">' + (done ? 'Continuer' : 'Commencer la leçon') + '</a><p class="inline-stats">' + statsLine() + '</p></div></section>'
      : '<section class="reprendre"><div class="eyebrow">Tout est à jour</div><h1>La suite arrive bientôt</h1>' +
        '<p class="meta">Ton coach prépare la prochaine leçon avec toi, à ta prochaine séance. En attendant, ton scroll t\'attend sur ton téléphone.</p><p class="inline-stats">' + statsLine() + '</p></section>';
    const map = '<section class="sec"><header class="sec-head"><h2>Ton parcours</h2>' +
      '<p class="sub">Douze phases, à ton rythme. Elles sont numérotées en hexadécimal, comme les adresses mémoire : <code>0x0A</code> veut dire 10. Tu sauras pourquoi en phase 2.</p></header>' +
      '<ol class="map">' + C.parcours.phases.map((p) => phaseRow(p, cur)).join('') + '</ol></section>';
    const fils = '<section class="sec"><header class="sec-head"><h2>Les fils rouges</h2><p class="sub">Ils traversent toutes les phases.</p></header><div class="fils">' +
      (C.parcours.filsRouges || []).map((f) => '<div class="fil"><h3>' + esc(f.titre) + '</h3><p>' + md(f.texte) + '</p>' + (f.id === 'bestiaire' ? '<a class="lnk" href="#bestiaire">Ouvrir le bestiaire</a>' : '') + '</div>').join('') +
      '</div></section>';
    return '<div class="page">' + head + map + fils + '</div>';
  }
  function phaseRow(p, cur) {
    const state = p.n < cur ? 'faite' : (p.n === cur ? 'encours' : 'verrou');
    const chip = state === 'faite' ? '<span class="chip ok">' + ICON.check + ' Terminée</span>'
      : state === 'encours' ? '<span class="chip cur">' + ICON.ip + ' En cours</span>'
      : '<span class="chip">' + ICON.lock + ' Plus tard</span>';
    const lecs = state === 'encours' && p.lecons && p.lecons.length ? '<ol class="ph-lecons">' + p.lecons.map(lessonRow).join('') + '</ol>' : '';
    return '<li class="ph is-' + state + '"><span class="ph-addr">' + esc(p.hex) + '</span><span class="ph-node" aria-hidden="true"></span>' +
      '<div class="ph-body"><div class="ph-top"><h3>' + esc(p.nom) + '</h3>' + chip + '<span class="ph-duree">' + esc(p.duree) + '</span></div>' +
      '<p class="ph-sauras">Tu sauras ' + md(p.sauras) + '.</p><p class="ph-boss"><span class="lbl">Boss</span>' + md(p.boss) + '</p>' + lecs + '</div></li>';
  }
  function lessonRow(l) {
    const d = isDone(l.id);
    const n = nextLesson();
    const isNext = !!n && n.id === l.id;
    const st = d ? '<span class="lst ok">' + ICON.check + ' Faite</span>' : l.dispo ? '<span class="lst cur">' + (isNext ? 'À faire' : 'Disponible') + '</span>' : '<span class="lst">Bientôt</span>';
    const inner = '<span class="lnum">' + esc(l.numero) + '</span><span class="lt">' + esc(l.titre) + '</span><span class="ld">' + l.duree + ' min</span>' + st;
    return '<li>' + (l.dispo ? '<a class="lec' + (isNext ? ' is-next' : '') + '" href="#lecon-' + esc(l.id) + '">' + inner + '</a>' : '<span class="lec is-off">' + inner + '</span>') + '</li>';
  }

  /* ================= Vue : leçon ================= */
  const R = {
    accroche: (b) => '<p class="b-accroche">' + md(b.texte) + '</p>',
    texte: (b) => '<section class="b-texte">' + (b.titre ? '<h2>' + esc(b.titre) + '</h2>' : '') + ((b.paragraphes && b.paragraphes.length) ? b.paragraphes : [b.texte]).filter(Boolean).map((p) => '<p>' + md(p) + '</p>').join('') + '</section>',
    schema: (b) => schemaBlock(b),
    code: (b) => codeBlock(b),
    capot: (b, i) => capotBlock(b, i),
    encadre: (b) => '<aside class="b-encadre v-' + esc(b.variante || 'astuce') + '"><span class="enc-lbl">' + esc(ENC_LBL[b.variante] || 'À noter') + '</span>' + (b.titre ? '<h3>' + esc(b.titre) + '</h3>' : '') + '<p>' + md(b.texte) + '</p></aside>',
    anglais: (b) => '<section class="b-anglais"><h2>' + esc(b.titre || 'Les mots anglais') + '</h2><p class="sub">Les outils et la documentation sont en anglais. Voici ceux que tu croiseras.</p><dl class="mots">' +
      (b.mots || []).map((m) => '<div class="mot"><dt lang="en">' + esc(m.en) + '</dt><dd><span class="fr">' + esc(m.fr) + '</span>' + (m.note ? '<span class="note">' + md(m.note) + '</span>' : '') + '</dd></div>').join('') + '</dl></section>',
    tesjeux: (b) => '<section class="b-jeux"><h2>' + esc(b.titre || 'Et tes jeux ?') + '</h2>' + (b.intro ? '<p>' + md(b.intro) + '</p>' : '') + '<ul class="jeux">' +
      (b.jeux || []).map((j) => '<li class="jeu"><span class="jeu-tile" aria-hidden="true">' + esc(mono(j.nom)) + '</span><div class="jeu-body"><div class="jeu-top"><strong>' + esc(j.nom) + '</strong>' + (j.langage ? '<span class="chip">' + esc(j.langage) + '</span>' : '') + '</div><p>' + md(j.texte) + '</p></div></li>').join('') + '</ul></section>',
    atoi: (b) => atoiBlock(b),
    quiz: (b) => quizBlock(b),
    resume: (b) => '<section class="b-resume"><h2>' + esc(b.titre || 'À retenir') + '</h2><ul>' + (b.points || []).map((p) => '<li>' + md(p) + '</li>').join('') + '</ul></section>',
    suite: (b) => '<section class="b-suite"><span class="eyebrow">Ensuite</span>' + (b.titre ? '<h3>' + esc(b.titre) + '</h3>' : '') + (b.texte ? '<p>' + md(b.texte) + '</p>' : '') + '</section>',
  };
  function mono(nom) {
    const k = norm(nom);
    if (k.indexOf('minecraft') >= 0) return 'MC';
    if (k.indexOf('garry') >= 0) return 'GM';
    if (k.indexOf('oblivion') >= 0) return 'OB';
    if (k.indexOf('gta') >= 0) return 'V';
    return String(nom || '?').slice(0, 2).toUpperCase();
  }
  function schemaBlock(b) {
    if (b.id !== 'compilation') return b.legende ? '<p class="muted">' + md(b.legende) + '</p>' : '';
    return '<figure class="b-schema"><div class="flow" role="img" aria-label="Le code source passe par le compilateur MSVC, qui produit un programme .exe, que le processeur exécute.">' +
      '<div class="fnode"><span class="fk">Code source</span><code class="fv">vie.cpp</code><span class="fd">Du texte que tu écris et que tu peux lire.</span></div>' +
      '<div class="farrow" aria-hidden="true"></div>' +
      '<div class="fnode tool"><span class="fk">Compilateur</span><span class="fv">MSVC</span><span class="fd">Il traduit une fois pour toutes, à l\'avance.</span></div>' +
      '<div class="farrow" aria-hidden="true"></div>' +
      '<div class="fnode"><span class="fk">Programme</span><code class="fv">jeu.exe</code><span class="fd bytes">B8 64 00 00 00 C3</span></div>' +
      '<div class="farrow" aria-hidden="true"></div>' +
      '<div class="fnode cpu"><span class="fk">Processeur</span><span class="fv">exécute</span><span class="fd">Des milliards d\'instructions par seconde.</span></div>' +
      '</div>' + (b.legende ? '<figcaption>' + md(b.legende) + '</figcaption>' : '') + '</figure>';
  }
  function codeBlock(b) {
    const notes = (b.notes || []).slice().sort((x, y) => x.ligne - y.ligne);
    return '<figure class="b-code">' + '<figcaption><span>' + esc(b.titre || '') + '</span><span class="lang">' + esc(LANG_LBL[b.langage] || b.langage || '') + '</span></figcaption>' +
      '<pre class="code"><code>' + codeLines(b.code, b.langage) + '</code></pre>' +
      (notes.length ? '<ol class="notes">' + notes.map((n) => '<li data-l="' + n.ligne + '"><span class="nl">Ligne ' + n.ligne + '</span><span>' + md(n.texte) + '</span></li>').join('') + '</ol>' : '') + '</figure>';
  }
  function bytesHTML(hex) {
    const parts = String(hex || '').trim().split(/\s+/).filter(Boolean);
    return parts.map((p, i) => '<span class="byte' + (i === 0 ? ' op' : ' val') + '">' + esc(p) + '</span>').join('');
  }
  function capotBlock(b, idx) {
    const cppG = {}, asmG = {};
    (b.liens || []).forEach((g, k) => { cppG[g.cpp] = k; (g.asm || []).forEach((a) => { asmG[a] = k; }); });
    const asmLines = String(b.asm || '').replace(/\s+$/, '').split('\n');
    const insLines = [];
    asmLines.forEach((l, i) => { if (/^\s+\S/.test(l)) insLines.push(i + 1); });
    const octets = (b.octets || []).map((o, k) => '<div class="oct" data-oa="' + (insLines[k] || '') + '"><code class="oct-hex">' + bytesHTML(o.hex) + '</code><span class="oct-asm">' + esc(o.asm) + '</span>' + (o.explication ? '<span class="oct-exp">' + md(o.explication) + '</span>' : '') + '</div>').join('');
    const titre = b.titre && norm(b.titre) !== 'sous le capot' ? '<h2>' + esc(b.titre) + '</h2>' : '';
    return '<section class="b-capot" data-capot="' + idx + '">' +
      '<div class="capot-head"><span class="capot-lbl">Sous le capot</span>' + titre + '</div>' +
      (b.intro ? '<p>' + md(b.intro) + '</p>' : '') +
      '<div class="capot-panes">' +
        '<div class="pane"><span class="pane-lbl">Ton C++</span><pre class="code"><code>' + codeLines(b.cpp, 'cpp', cppG, 'cpp') + '</code></pre></div>' +
        '<div class="pane-arrow" aria-hidden="true"><span class="h">MSVC →</span><span class="v">↓ compilé par MSVC</span></div>' +
        '<div class="pane"><span class="pane-lbl">Ce que produit MSVC (assembleur x64)</span><pre class="code"><code>' + codeLines(b.asm, 'asm', asmG, 'asm') + '</code></pre></div>' +
      '</div>' +
      (octets ? '<div class="octets"><span class="pane-lbl">Dans le fichier .exe : les octets</span><div class="oct-row">' + octets + '</div></div>' : '') +
      (b.conclusion ? '<p>' + md(b.conclusion) + '</p>' : '') +
      '<div class="capot-foot">' + (b.godbolt ? '<a class="btn ghost" href="' + esc(b.godbolt) + '" target="_blank" rel="noopener">Voir en direct dans Compiler Explorer</a>' : '') +
      '<p class="capot-hint">Survole ou touche une ligne : sa traduction s\'allume de l\'autre côté.</p></div>' +
    '</section>';
  }
  function atoiBlock(b) {
    const titre = String(b.titre || '').replace(/^À toi\s*:\s*/i, '');
    return '<section class="b-atoi"><span class="atoi-lbl">À toi</span>' + (titre ? '<h2>' + esc(titre) + '</h2>' : '') +
      (b.lien && b.lien.url ? '<a class="btn primary" href="' + esc(b.lien.url) + '" target="_blank" rel="noopener">' + esc(b.lien.texte || 'Ouvrir') + '</a>' : '') +
      '<ol class="etapes">' + (b.etapes || []).map((e) => '<li>' + md(e) + '</li>').join('') + '</ol>' +
      ((b.indices && b.indices.length) ? '<div class="indices">' + b.indices.map((x, k) => '<p class="indice" hidden><span class="lbl">Indice ' + (k + 1) + '</span>' + md(x) + '</p>').join('') + '<button class="btn ghost" data-act="indice">Un indice</button></div>' : '') +
      (b.solution ? '<div class="solution"><button class="btn ghost" data-act="solution" aria-expanded="false">Voir la solution</button><div class="sol-body" hidden><p>' + md(b.solution) + '</p></div></div>' : '') +
    '</section>';
  }
  function quizBlock(b) {
    const qs = b.questions || [];
    return '<section class="b-quiz"><h2>' + esc(b.titre || 'Mini-quiz') + '</h2>' +
      qs.map((q, qi) => '<div class="q" data-bonne="' + q.bonne + '"><p class="q-t"><span class="q-n">' + (qi + 1) + '/' + qs.length + '</span>' + md(q.q) + '</p>' +
        '<div class="q-choix">' + (q.choix || []).map((c, ci) => '<button class="choix" data-act="qchoix" data-ci="' + ci + '">' + md(c) + '</button>').join('') + '</div>' +
        '<p class="q-exp" hidden>' + md(q.explication) + '</p></div>').join('') +
      '<p class="q-score" aria-live="polite" hidden></p></section>';
  }
  async function renderLecon(id) {
    const vue = $('#vue');
    const meta = lessons().find((l) => l.id === id);
    if (!meta || !meta.dispo) {
      vue.innerHTML = '<div class="lecon"><a class="back" href="#accueil">← Parcours</a><h1>Leçon bientôt disponible</h1><p>Elle arrive au fil de ta progression : ton coach la prépare quand tu en approches.</p></div>';
      return;
    }
    let L;
    try { L = await loadLecon(id); } catch (e) {
      vue.innerHTML = '<div class="lecon"><a class="back" href="#accueil">← Parcours</a><p>La leçon n\'a pas pu se charger. Recharge la page.</p></div>';
      return;
    }
    const r = route();
    if (r.view !== 'lecon' || r.id !== id) return;
    const phase = C.parcours.phases.find((p) => p.n === L.phase) || {};
    vue.innerHTML = '<article class="lecon" data-lecon="' + esc(id) + '">' +
      '<a class="back" href="#accueil">← Parcours</a>' +
      (MODE === 'tel' ? '<p class="tel-note">Cette leçon se fait sur ton PC, là où tu coderas. Ici, tu peux la lire.</p>' : '') +
      '<header class="lecon-head"><div class="eyebrow"><span class="addr">' + esc(phase.hex || '') + '</span>Phase ' + esc(L.phase) + ' · ' + esc(phase.nom || '') + ' · Leçon ' + esc(L.numero) + '</div>' +
        '<h1>' + esc(L.titre) + '</h1><p class="lecon-meta"><span class="dur">' + esc(L.duree) + ' min</span><span>' + md(L.objectif) + '</span></p></header>' +
      (L.blocs || []).map((b, i) => (R[b.type] ? R[b.type](b, i) : '')).join('') +
      '<section class="fin-lecon" id="fin-lecon"></section>' +

  let coachCtl = null, sheetCtl = null;
  function sampleError(e) {
    const code = e && e.code;
    if (code === 'cancelled') return '';
    if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].indexOf(code) >= 0) { SAMPLE_OFF = true; return 'Les réponses de Claude ne sont pas disponibles ici.'; }
    if (code === 'rate_limited') return 'Trop de demandes d\'un coup : réessaie dans un moment.';
    if (code === 'session_expired') return 'Reconnecte-toi à Claude, puis réessaie.';
    if (code === 'refused') return 'Claude ne peut pas répondre à cette question-là.';
    return 'La réponse n\'a pas pu arriver. Réessaie.';
  }

  async function askLecon(id) {
    const L = C.lecons[id]; if (!L || !SAMPLE) return;

    const out = $('#coach-rep'), go = $('#coach [data-act="demander"]'), stop = $('#coach [data-act="stop"]');
    go.disabled = true; stop.hidden = false; out.textContent = 'Je réfléchis…';
    coachCtl = new AbortController();
    const prompt = 'Tu es le coach de programmation d\'une personne qui débute en C++ : son but est de comprendre le code des jeux vidéo (Minecraft, Oblivion, GTA V, Garry\'s Mod). Elle lit la leçon ci-dessous et te pose une question. Réponds en français, en la tutoyant, en 3 à 8 phrases courtes et claires, sans jargon non expliqué. Reste dans le sujet ; si la question porte sur la triche en ligne ou le crack d\'un jeu, explique gentiment que le cours reste hors-ligne, sur ses propres programmes et des cibles autorisées. N\'emploie aucun adjectif genré pour parler de cette personne. Pas d\'émoji, pas de titre.\n\nLEÇON :\n' + lessonText(L).slice(0, 7000) + '\n\nQUESTION :\n' + q.slice(0, 1500);
    try {
      const res = await SAMPLE(prompt, { signal: coachCtl.signal, onText: (u) => { out.textContent = u.text; } });

      out.textContent = (e && e.text) || '';

  /* ================= Le scroll (téléphone) ================= */
  const Feed = { queue: [], viewed: new Set(), touched: false, io: null, timers: new Map() };
  function teardownFeed() {
    if (Feed.io) { Feed.io.disconnect(); Feed.io = null; }
    Feed.timers.forEach((t) => clearTimeout(t));
    Feed.timers.clear();
    if (sheetCtl) { sheetCtl.abort(); sheetCtl = null; }

  function buildQueue(n, exclude) {
    const t = today(), st = Store.srs.cartes || {};
    const open = C.cartes.filter((c) => cardOpen(c) && !exclude.has(c.id));
    const pools = {
      due: open.filter((c) => st[c.id] && !INFO.has(c.type) && st[c.id].d <= t).sort((a, b) => (st[a.id].d < st[b.id].d ? -1 : 1)),
      learn: open.filter((c) => !st[c.id] && !INFO.has(c.type) && c.type !== 'code'),
      code: open.filter((c) => !st[c.id] && c.type === 'code'),
      info: open.filter((c) => !st[c.id] && INFO.has(c.type)),
    };
    const pattern = ['due', 'learn', 'learn', 'info', 'due', 'code', 'learn', 'info'];
    const out = [];
    for (let i = 0; out.length < n && i < 400; i++) {
      let c = pools[pattern[i % pattern.length]].shift();
      if (!c) { const k = ['due', 'learn', 'code', 'info'].find((x) => pools[x].length); if (!k) break; c = pools[k].shift(); }
      out.push(c);
    }
    return out;
  }
  function reviewRandom(n, exclude) {
    const st = Store.srs.cartes || {};
    return C.cartes.filter((c) => st[c.id] && !INFO.has(c.type) && !exclude.has(c.id) && cardOpen(c))
      .sort((a, b) => (st[a.id].d < st[b.id].d ? -1 : 1)).slice(0, n);
  }

    return '<article class="fcard t-fin"><div class="fc-in"><header class="fc-top"><span class="fc-type">Scroll</span></header>' +
      '<div class="fc-main"><h2 class="fc-titre">Rien de neuf pour l\'instant.</h2><p class="fc-texte">Fais la prochaine leçon sur ton PC : ses cartes arriveront ici.</p></div>' +
      '<footer class="fc-act">' + (any ? '<button class="btn primary wide" data-act="encore">Réviser au hasard</button>' : '') + '<a class="lnk" href="#accueil">Voir mon parcours</a></footer></div></article>';
  }
  function updateHud() {
    const hud = $('#hud'); if (!hud) return;
    const v = (Store.srs.doses || {})[today()] || 0;
    hud.innerHTML = '<span class="hud-serie" title="Jours d\'affilée avec au moins 5 cartes">' + ICON.flame + plural(serieNow(), 'jour', 'jours') + '</span>' +
      '<span class="hud-dose"><span class="bar"><span style="width:' + Math.min(100, Math.round((v / DOSE) * 100)) + '%"></span></span>' + v + '/' + DOSE + '</span>';
    $$('[data-fin-stats]').forEach((el) => { el.textContent = finStats(); });
  }
  function observeFeed() {
    const root = $('#feed'); if (!root || !('IntersectionObserver' in window)) return;
    Feed.io = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        const el = en.target;
        if (en.isIntersecting && en.intersectionRatio >= 0.7) {
          if (!Feed.timers.has(el)) Feed.timers.set(el, setTimeout(() => { Feed.timers.delete(el); markViewed(el); }, 1500));
        } else if (Feed.timers.has(el)) { clearTimeout(Feed.timers.get(el)); Feed.timers.delete(el); }
      });
    }, { root, threshold: [0, 0.7, 1] });
    $$('.fcard[data-id]', root).forEach((el) => Feed.io.observe(el));
  }
  function bumpSerie() {
    const t = today();
    const s = Object.assign({ n: 0, jour: '' }, Store.srs.serie);
    if (s.jour === t) return;
    s.n = s.jour === addDays(t, -1) ? (s.n || 0) + 1 : 1;
    s.jour = t;
    Store.srs.serie = s;
  }
  function markViewed(el) {
    const id = el.dataset.id;
    if (!id || Feed.viewed.has(id)) return;
    Feed.viewed.add(id);
    const t = today();
    const d = Store.srs.doses || (Store.srs.doses = {});
    d[t] = (d[t] || 0) + 1;
    if (d[t] >= 5) bumpSerie();
    Store.saveSrs();
    updateHud();
  }
  function grade(c, ok) {
    const cartes = Store.srs.cartes || (Store.srs.cartes = {});
    const s = Object.assign({ b: 0, v: 0, ok: 0, ko: 0 }, cartes[c.id]);
    s.v += 1;
    if (ok) { s.ok += 1; s.b = Math.min((s.b || 0) + 1, 5); } else { s.ko += 1; s.b = 1; }
    s.d = addDays(today(), INTERVALS[s.b]);
    cartes[c.id] = s;
    Store.saveSrs();
  }
  function seenInfo(c) {
    const cartes = Store.srs.cartes || (Store.srs.cartes = {});
    const s = Object.assign({ b: 0, v: 0, ok: 0, ko: 0 }, cartes[c.id]);
    s.v += 1; s.b = 5; s.d = addDays(today(), 45);
    cartes[c.id] = s;
    Store.saveSrs();
  }
  function goNext(card) {
    const nx = card && card.nextElementSibling;
    if (nx) nx.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
  }
  function moreCards(btn) {
    const feed = $('#feed'); if (!feed) return;
    const shown = new Set(Feed.queue.map((c) => c.id));
    let more = buildQueue(6, shown);
    if (!more.length) more = reviewRandom(6, shown);
    const host = btn.closest('.fcard');
    if (!more.length) { btn.replaceWith(Object.assign(document.createElement('p'), { className: 'fc-texte muted', textContent: 'Tu as tout vu pour aujourd\'hui. Bravo, et à demain.' })); return; }
    const start = Feed.queue.length;
    Feed.queue = Feed.queue.concat(more);
    host.insertAdjacentHTML('afterend', more.map((c, k) => feedCard(c, start + k)).join('') + endCard());
    btn.disabled = true;
    $$('.fcard[data-id]', feed).forEach((el) => { if (Feed.io) Feed.io.observe(el); });
    goNext(host);
  }
  function openSheet(c, card) {
    const root = $('#sheet-root'); if (!root) return;
    const canAsk = !!SAMPLE && !SAMPLE_OFF;
    root.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t" data-id="' + esc(c.id) + '"><div class="sheet-in">' +
      (HOSTED ? '<h3 id="sheet-t">Noté pour ta prochaine séance</h3><p>Ton coach verra que cette carte t\'a posé problème, et vous la reprendrez ensemble.</p>'
        : '<h3 id="sheet-t">Carte remise en révision</h3><p>Elle reviendra bientôt. Pour une explication, écris son titre à ton coach dans VS Code.</p>') +
      (canAsk ? '<button class="btn primary wide" data-act="reexpliquer">Réexplique-moi autrement</button>' : '') +
      '<div class="sheet-rep" aria-live="polite"></div><button class="btn ghost wide" data-act="fermer">Fermer</button></div></div>';
    const first = $('.sheet [data-act]', root); if (first) first.focus();
    if (card && !card.dataset.graded && !INFO.has(c.type)) { card.dataset.graded = '1'; grade(c, false); }
    Store.addFlag({ source: 'scroll', carte: c.id, titre: c.titre || c.question || c.affirmation || c.en || '', type: c.type, lecon: c.lecon || '' });
  }
  function closeSheet() {
    if (sheetCtl) { sheetCtl.abort(); sheetCtl = null; }
    const root = $('#sheet-root'); if (root) root.innerHTML = '';
  }
  async function reexplain(btn) {
    const sheet = btn.closest('.sheet');
    const c = C.cartes.find((x) => x.id === sheet.dataset.id);
    if (!c || !SAMPLE) return;
    const out = $('.sheet-rep', sheet);
    btn.disabled = true;
    out.textContent = 'Je réfléchis…';
    sheetCtl = new AbortController();
    const content = [c.titre, c.texte, c.question, c.affirmation, c.code, c.reponse, c.explication, c.en ? c.en + ' = ' + c.fr : '', c.cpp, c.asm].filter(Boolean).join('\n');
    const prompt = 'Tu es le coach de programmation d\'une personne qui débute : elle apprend le C++ pour comprendre le code des jeux vidéo (Minecraft, Oblivion, GTA V, Garry\'s Mod). Elle n\'a pas compris la carte ci-dessous. Réexplique la même idée autrement, en français, en la tutoyant : 3 à 5 phrases courtes, des mots simples, un exemple concret tiré d\'un jeu vidéo si ça aide. N\'emploie aucun adjectif genré pour parler de cette personne. Pas d\'émoji, pas de titre, pas de liste.\n\nCARTE :\n' + content.slice(0, 4000);
    try {
      const res = await SAMPLE(prompt, { modelTier: 'quick', signal: sheetCtl.signal, onText: (u) => { out.textContent = u.text; } });
      out.textContent = res.text;
    } catch (e) {
      out.textContent = (e && e.text) || '';
      const m = sampleError(e);
      if (m) out.insertAdjacentHTML('beforeend', '<span class="err">' + esc(m) + '</span>');
    } finally { btn.disabled = false; }
  }
  function onFeedClick(el) {
    const act = el.dataset.act;
    if (act === 'encore') { moreCards(el); return; }
    if (act === 'fermer') { closeSheet(); return; }
    if (act === 'reexpliquer') { reexplain(el); return; }
    const card = el.closest('.fcard'); if (!card) return;
    const c = C.cartes.find((x) => x.id === card.dataset.id); if (!c) return;
    Feed.touched = true;
    if (act === 'choix' || act === 'vf') {
      if (card.classList.contains('answered')) return;
      let ok;
      const btns = $$('.choix', card);
      if (act === 'choix') {
        ok = +el.dataset.ci === c.bonne;
        btns.forEach((b, k) => { b.disabled = true; if (k === c.bonne) b.classList.add('is-ok'); });
      } else {
        ok = (el.dataset.v === '1') === !!c.vrai;
        btns.forEach((b) => { b.disabled = true; if ((b.dataset.v === '1') === !!c.vrai) b.classList.add('is-ok'); });
      }
      if (!ok) el.classList.add('is-ko');
      card.classList.add('answered', ok ? 'res-ok' : 'res-ko');
      const exp = $('.fc-exp', card);
      if (exp) { exp.hidden = false; exp.insertAdjacentHTML('afterbegin', '<strong class="verdict">' + (ok ? 'Exact.' : 'Pas tout à fait.') + '</strong> '); }
      const after = $('.after', card); if (after) after.hidden = false;
      card.dataset.graded = '1';
      grade(c, ok);
      markViewed(card);
      return;
    }
    if (act === 'reveal') { const r = $('.fc-rep', card); if (r) r.hidden = false; el.hidden = true; const a = $('.after', card); if (a) a.hidden = false; return; }
    if (act === 'flip') { const f = $('.fc-fr', card); if (f) f.hidden = false; el.hidden = true; const a = $('.after', card); if (a) a.hidden = false; return; }
    if (act === 'ok' || act === 'ko') { if (!card.dataset.graded) { card.dataset.graded = '1'; grade(c, act === 'ok'); } markViewed(card); goNext(card); return; }
    if (act === 'info') { if (!card.dataset.graded) { card.dataset.graded = '1'; seenInfo(c); } markViewed(card); goNext(card); return; }
    if (act === 'next') { goNext(card); return; }
    if (act === 'pascompris') { openSheet(c, card); }
  }

  /* ================= Événements ================= */
  function onClick(e) {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    if (el.closest('.feed-wrap')) { onFeedClick(el); return; }
    const act = el.dataset.act;
    const lec = el.closest('.lecon');
    if (act === 'qchoix') { answerQuiz(el); return; }
    if (act === 'indice') { nextHint(el); return; }
    if (act === 'solution') { toggleSolution(el); return; }
    if (act === 'terminer' && lec) { finishLecon(lec.dataset.lecon); return; }
    if (act === 'demander' && lec) { askLecon(lec.dataset.lecon); return; }
    if (act === 'stop') { if (coachCtl) coachCtl.abort(); return; }
    if (act === 'signaler' && lec) { signalLecon(lec.dataset.lecon); return; }
    if (act === 'reset1') { el.parentElement.hidden = true; el.closest('.moi-sec').querySelector('.confirm').hidden = false; return; }
    if (act === 'reset-non') { const c = el.closest('.confirm'); c.hidden = true; c.previousElementSibling.hidden = false; return; }
    if (act === 'reset-oui') {
      Store.prog = { lecons: {}, maj: '' };
      Store.srs = { cartes: {}, serie: { n: 0, jour: '' }, doses: {} };
      Store.saveProg(); Store.saveSrs();
      render();
    }
  }
  function onChange(e) {
    if (e.target.id === 'set-theme') { LS.set('theme', e.target.value); applyTheme(); }
    if (e.target.id === 'set-mode') { LS.set('mode', e.target.value); location.hash = 'moi'; mount(); }
  }
  function onHover(e) {
    const t = e.target;
    if (!t || !t.closest) return;
    const capot = t.closest('.b-capot');
    if (capot) {
      $$('.cl.on, .oct.on', capot).forEach((x) => x.classList.remove('on'));
      const line = t.closest('.cl[data-g]');
      if (line) $$('.cl[data-g="' + line.dataset.g + '"]', capot).forEach((x) => x.classList.add('on'));
      const oct = t.closest('.oct');
      if (oct && oct.dataset.oa) {
        oct.classList.add('on');
        const al = $('.cl[data-side="asm"][data-l="' + oct.dataset.oa + '"]', capot);
        if (al && al.dataset.g != null) $$('.cl[data-g="' + al.dataset.g + '"]', capot).forEach((x) => x.classList.add('on'));
        else if (al) al.classList.add('on');
      }
      return;
    }
    $$('.b-code .cl.hi').forEach((x) => x.classList.remove('hi'));
    const note = t.closest('.notes li');
    if (note) { const fig = note.closest('.b-code'); const l = fig && $('.cl[data-l="' + note.dataset.l + '"]', fig); if (l) l.classList.add('hi'); }
  }
  function onStore(what) {
    const r = route();
    if (what === 'sync') {
      const sy = $('#sync'); if (sy) sy.textContent = syncText();
      if (r.view === 'moi') render();
      return;
    }
    renderNav(r);
    if (r.view === 'accueil' || r.view === 'moi' || r.view === 'glossaire' || r.view === 'bestiaire') { render(); return; }
    if (r.view === 'lecon' && what === 'prog') { updateLeconFooter(); return; }
    if (r.view === 'scroll' && MODE === 'tel') {
      if (!Feed.touched && Feed.viewed.size === 0) renderFeed(); else updateHud();
    }
  }
  function errorView() {
    const local = location.protocol === 'file:';
    return '<div class="boot"><div><div class="wm">CZKLearning</div><p>' +
      (local ? 'Ce fichier se lit en ligne, sur ton compte Claude.' + (ARTIFACT_URL ? ' Ouvre : ' + esc(ARTIFACT_URL) : '') : 'Le contenu n\'a pas pu se charger. Recharge la page.') + '</p></div></div>';
  }

  async function start() {
    applyTheme();
    const ok = await loadContent();
    if (!ok) { const app = $('#app'); app.className = 'boot'; app.innerHTML = errorView(); return; }
    mount();
    window.addEventListener('hashchange', render);
    document.addEventListener('click', onClick);
    document.addEventListener('change', onChange);
    document.addEventListener('mouseover', onHover);
    document.addEventListener('focusin', onHover);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Store.flushAll(); });
    Store.on(onStore);
    Store.init();
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('sample').then((s) => { SAMPLE = s || null; initCoach(); }).catch(() => { SAMPLE = null; });
    }
  }
  start();
})();
</script>
</body></html>
